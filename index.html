                            prepareNextTurn();
                        });
                    }
                }, 350);
            };

            const enterMatchMode = () => {
                soundManager.play('click');
                setPreMatchState({
                    gameState: gameState,
                    message: message
                });
                setGameState('match-mode');
                setMessage("MATCH: Tap matching card on table!");
            };

            const handleMatchAttempt = (targetPlayerIdx, targetCardIdx, wasBotTriggered = false, botMatcherIdx = null) => {
                if (!matchWindowActive && gameState !== 'match-mode') return;

                const currentPlayers = playersRef.current;
                const targetCard = currentPlayers[targetPlayerIdx]?.cards?.[targetCardIdx];
                if (!targetCard) return;

                const comparisonCard = activeCard ? activeCard : discardPileRef.current[discardPileRef.current.length - 1];
                if (!comparisonCard) return;

                clearTimers();
                setMatchWindowActive(false);

                const matcherIdx = wasBotTriggered ? botMatcherIdx : 0;

                if (!wasBotTriggered && botMatchTimerRef.current) {
                    const coinFlip = Math.random() < 0.5;
                    if (!coinFlip) {
                        setMessage("Too slow! A bot beat you to the match!");
                        setTimeout(() => {
                            for (let pIdxBot = 1; pIdxBot < playerCount; pIdxBot++) {
                                for (let cIdxBot = 0; cIdxBot < currentPlayers[pIdxBot].cards.length; cIdxBot++) {
                                    const known = aiMemoryRef.current[`${pIdxBot}-${cIdxBot}`];
                                    if (known && known.value === comparisonCard.value) {
                                        executeMatchSuccess(pIdxBot, pIdxBot, cIdxBot, comparisonCard);
                                        return;
                                    }
                                }
                            }
                        }, 1000);
                        return;
                    }
                }

                if (targetCard.value === comparisonCard.value) {
                    executeMatchSuccess(matcherIdx, targetPlayerIdx, targetCardIdx, comparisonCard);
                } else {
                    soundManager.play('wrong');
                    let finalMessage = `WRONG! Penalty card added to ${currentPlayers[matcherIdx]?.name || 'Player'}!`;
                    const { deck: availDeck } = restoreDeckFromDiscard(deckRef.current, discardPileRef.current, true);
                    const newDeck = [...availDeck];
                    const penaltyCard = newDeck.pop();

                    if (penaltyCard) {
                        setDeck(newDeck);
                        setPlayers(prev => {
                            const updated = JSON.parse(JSON.stringify(prev));
                            if (updated[matcherIdx]?.cards) {
                                updated[matcherIdx].cards.push({ ...penaltyCard, visible: false, id: `p${matcherIdx}-penalty-${Date.now()}` });
                            }
                            return updated;
                        });
                    } else {
                        finalMessage = `WRONG MATCH! No penalty cards available.`;
                    }

                    if (activeCard && matcherIdx === 0) {
                        finalMessage = `WRONG MATCH! The drawn ${activeCard.value}${activeCard.suit} is lost, and you get a penalty!`;
                        setDiscardPile(prev => [...prev, activeCard].filter(Boolean));
                        setActiveCard(null);
                    }

                    setMessage(finalMessage);

                    setTimeout(() => {
                        restorePreMatchOrProceed();
                    }, 2500);
                }
            };

            const executeMatchSuccess = (matcherIdx, targetPlayerIdx, targetCardIdx, comparisonCard) => {
                soundManager.play('match');
                setAnimatingIndices([{ playerIdx: targetPlayerIdx, cardIdx: targetCardIdx, action: 'burn' }]);

                setTimeout(() => {
                    updateAiMemory(targetPlayerIdx, targetCardIdx, null);

                    const currentPlayers = playersRef.current;
                    const targetCard = currentPlayers[targetPlayerIdx]?.cards?.[targetCardIdx];
                    if (!targetCard) {
                        setAnimatingIndices([]);
                        restorePreMatchOrProceed();
                        return;
                    }

                    const matcherName = matcherIdx === 0 ? "You" : (currentPlayers[matcherIdx]?.name || "Bot");
                    const targetName = targetPlayerIdx === 0 ? "You" : (currentPlayers[targetPlayerIdx]?.name || "Bot");
                    const matchMsg = matcherIdx === targetPlayerIdx
                        ? `BURNED: ${matcherName} matched and burned their own ${targetCard.value}${targetCard.suit}!`
                        : `BURNED: ${matcherName} matched ${targetName}'s ${targetCard.value}${targetCard.suit}!`;

                    setPlayers(prev => {
                        const updated = JSON.parse(JSON.stringify(prev));
                        if (updated[targetPlayerIdx]?.cards) {
                            updated[targetPlayerIdx].cards[targetCardIdx] = null;
                        }
                        return updated;
                    });

                    if (activeCard) {
                        setDiscardPile(prev => [...prev, targetCard, activeCard].filter(Boolean));
                        setActiveCard(null);
                    } else {
                        setDiscardPile(prev => [...prev, targetCard].filter(Boolean));
                    }

                    setAnimatingIndices([]);
                    setMessage(matchMsg);

                    if (matcherIdx === targetPlayerIdx) {
                        setTimeout(() => {
                            restorePreMatchOrProceed();
                        }, 1800);
                    } else {
                        const matcherCards = currentPlayers[matcherIdx]?.cards || [];
                        const validMatcherIndices = matcherCards.map((c, i) => c !== null ? i : null).filter(v => v !== null);
                        
                        if (validMatcherIndices.length > 0) {
                            setMessage(`Match! ${matcherName} is giving a card to ${targetName}...`);
                            setTimeout(() => {
                                const randomMatcherIndex = validMatcherIndices[Math.floor(Math.random() * validMatcherIndices.length)];
                                const givenCard = matcherCards[randomMatcherIndex];
                                
                                setAnimatingIndices([{ playerIdx: matcherIdx, cardIdx: randomMatcherIndex, targetPlayerIdx: targetPlayerIdx, targetCardIdx: targetCardIdx }]);
                                
                                setTimeout(() => {
                                    setPlayers(prev => {
                                        const nextPlayers = JSON.parse(JSON.stringify(prev));
                                        if (nextPlayers[matcherIdx]?.cards && nextPlayers[targetPlayerIdx]?.cards) {
                                            nextPlayers[matcherIdx].cards[randomMatcherIndex] = null;
                                            nextPlayers[targetPlayerIdx].cards[targetCardIdx] = givenCard;
                                        }
                                        return nextPlayers;
                                    });

                                    updateAiMemory(matcherIdx, randomMatcherIndex, null);
                                    updateAiMemory(targetPlayerIdx, targetCardIdx, givenCard);

                                    setAnimatingIndices([]);
                                    restorePreMatchOrProceed();
                                }, 350);
                            }, 1000);
                        } else {
                            setTimeout(() => {
                                restorePreMatchOrProceed();
                            }, 1500);
                        }
                    }
                }, 350);
            };

            const restorePreMatchOrProceed = () => {
                const callback = matchCallbackRef.current;
                matchCallbackRef.current = null;

                if (preMatchState) {
                    setGameState(preMatchState.gameState);
                    setMessage(preMatchState.message);
                    setPreMatchState(null);
                    if (callback) {
                        callback();
                    }
                } else {
                    setGameState('playing');
                    if (callback) {
                        callback();
                    } else {
                        prepareNextTurn();
                    }
                }
            };

            const cancelMatchWindow = () => {
                clearTimers();
                setMatchWindowActive(false);
                setMatchCountdown(0);
                restorePreMatchOrProceed();
            };

            const triggerMatchWindow = (callbackOnComplete) => {
                clearTimers();
                matchCallbackRef.current = callbackOnComplete;
                const topDiscard = activeCard ? activeCard : (discardPileRef.current[discardPileRef.current.length - 1] || activeCard);
                let botWillMatch = false;

                if (topDiscard) {
                    for (let pIdx = 1; pIdx < playerCount; pIdx++) {
                        const botCards = playersRef.current[pIdx]?.cards || [];
                        for (let cIdx = 0; cIdx < botCards.length; cIdx++) {
                            const known = aiMemoryRef.current[`${pIdx}-${cIdx}`];
                            if (known && known.value === topDiscard.value) {
                                botWillMatch = true;
                                clearTimers();

                                const delay = Math.floor(Math.random() * 1200) + 600;
                                botMatchTimerRef.current = setTimeout(() => {
                                    handleMatchAttempt(pIdx, cIdx, true, pIdx);
                                }, delay);
                                break;
                            }
                        }
                        if (botWillMatch) break;
                    }
                }

                setMatchWindowActive(true);
                let timeLeft = 4;
                setMatchCountdown(timeLeft);
                setMessage(`Match Window open! (${timeLeft}s)`);

                countdownIntervalRef.current = setInterval(() => {
                    timeLeft -= 1;
                    setMatchCountdown(timeLeft);
                    if (timeLeft > 0) {
                        setMessage(`Match Window open! (${timeLeft}s)`);
                    } else {
                        clearInterval(countdownIntervalRef.current);
                        countdownIntervalRef.current = null;
                        setMatchWindowActive(false);
                        const callback = matchCallbackRef.current;
                        matchCallbackRef.current = null;
                        if (callback) callback();
                    }
                }, 1000);
            };

            const handleCardClick = (pIdx, cIdx) => {
                const targetCard = playersRef.current[pIdx]?.cards?.[cIdx];

                if (gameState === 'match-mode') {
                    if (!targetCard) {
                        setMessage("Cannot match an empty card slot.");
                        return;
                    }
                    handleMatchAttempt(pIdx, cIdx);
                    return;
                }

                if (gameState === 'setup') {
                    if (pIdx === 0 && targetCard) {
                        handleSetupPeek(cIdx);
                    }
                    return;
                }

                if (!targetCard && gameState !== 'match-mode') return;

                if (activeCard && pIdx === 0 && gameState === 'playing') {
                    swapCard(cIdx);
                    return;
                }

                if (gameState === 'peek-power') {
                    if (pIdx !== 0) {
                        setMessage("Select one of YOUR cards to peek.");
                        return;
                    }
                    revealTemp(pIdx, cIdx, () => {
                        setGameState('playing');
                        triggerMatchWindow(() => {
                            prepareNextTurn();
                        });
                    });
                    return;
                }

                if (gameState === 'spy-power') {
                    if (pIdx === 0) {
                        setMessage("Select an OPPONENT'S card to spy.");
                        return;
                    }
                    revealTemp(pIdx, cIdx, () => {
                        setGameState('playing');
                        triggerMatchWindow(() => {
                            prepareNextTurn();
                        });
                    });
                    return;
                }

                if (gameState === 'swap-power-1') {
                    setSwapSelection([{ playerIdx: pIdx, cardIdx: cIdx }]);
                    setMessage("Tap second card to swap.");
                    setGameState('swap-power-2');
                    return;
                } else if (gameState === 'swap-power-2') {
                    const first = swapSelection[0];
                    if (first.playerIdx === pIdx && first.cardIdx === cIdx) {
                        setMessage("Selected the same card. Tap a different card.");
                        return;
                    }
                    performSwap(first.playerIdx, first.cardIdx, pIdx, cIdx);
                    return;
                }

                if (gameState === 'king-look') {
                    if (pIdx === 0) {
                        setMessage("King power: Tap an OPPONENT'S card to peek.");
                        return;
                    }
                    revealTemp(pIdx, cIdx, () => {
                        setMessage("Now swap any 2. Tap first card.");
                        setGameState('king-swap-1');
                    });
                    return;
                } else if (gameState === 'king-swap-1') {
                    setSwapSelection([{ playerIdx: pIdx, cardIdx: cIdx }]);
                    setMessage("Tap second card.");
                    setGameState('king-swap-2');
                    return;
                } else if (gameState === 'king-swap-2') {
                    const first = swapSelection[0];
                    if (first.playerIdx === pIdx && first.cardIdx === cIdx) {
                        setMessage("Selected the same card. Tap a different card.");
                        return;
                    }
                    performSwap(first.playerIdx, first.cardIdx, pIdx, cIdx);
                    return;
                }
            };

            const performSwap = (p1, c1, p2, c2, onComplete = null) => {
                soundManager.play('swap');
                setAnimatingIndices([
                    { playerIdx: p1, cardIdx: c1, targetPlayerIdx: p2, targetCardIdx: c2 },
                    { playerIdx: p2, cardIdx: c2, targetPlayerIdx: p1, targetCardIdx: c1 }
                ]);

                setTimeout(() => {
                    const currentPlayers = playersRef.current;
                    if (!currentPlayers[p1] || !currentPlayers[p2]) {
                        setAnimatingIndices([]);
                        triggerMatchWindow(() => {
                            if (onComplete) onComplete(); else prepareNextTurn();
                        });
                        return;
                    }

                    const cardA = currentPlayers[p1].cards?.[c1];
                    const cardB = currentPlayers[p2].cards?.[c2];
                    if (!cardA || !cardB) {
                        setAnimatingIndices([]);
                        triggerMatchWindow(() => {
                            if (onComplete) onComplete(); else prepareNextTurn();
                        });
                        return;
                    }

                    setPlayers(prev => {
                        const updated = JSON.parse(JSON.stringify(prev));
                        const temp = updated[p1].cards[c1];
                        updated[p1].cards[c1] = updated[p2].cards[c2];
                        updated[p2].cards[c2] = temp;
                        return updated;
                    });
                    
                    const m1 = aiMemoryRef.current[`${p1}-${c1}`];
                    const m2 = aiMemoryRef.current[`${p2}-${c2}`];
                    
                    setAiMemory(prev => {
                        const next = { ...prev };
                        if (m2) next[`${p1}-${c1}`] = m2; else delete next[`${p1}-${c1}`];
                        if (m1) next[`${p2}-${c2}`] = m1; else delete next[`${p2}-${c2}`];
                        return next;
                    });

                    setAnimatingIndices([]);
                    setMessage("Swapped!");
                    
                    setTimeout(() => {
                        setGameState('playing');
                        triggerMatchWindow(() => {
                            if (onComplete) onComplete(); else prepareNextTurn();
                        });
                    }, 800);
                }, 350);
            };

            const revealTemp = (pIdx, cIdx, callback) => {
                soundManager.play('peek');
                const card = playersRef.current[pIdx]?.cards?.[cIdx];
                if (!card) {
                    if (callback) callback();
                    return;
                }

                setPlayers(prev => {
                    const updated = JSON.parse(JSON.stringify(prev));
                    if (updated[pIdx]?.cards?.[cIdx]) {
                        updated[pIdx].cards[cIdx].visible = true;
                    }
                    return updated;
                });

                setTimeout(() => {
                    setPlayers(prev => {
                        const hiddenUpdated = JSON.parse(JSON.stringify(prev));
                        if (hiddenUpdated[pIdx]?.cards?.[cIdx]) {
                            hiddenUpdated[pIdx].cards[cIdx].visible = false;
                        }
                        return hiddenUpdated;
                    });
                    if (callback) callback();
                }, 2000);
            };

            const getNextPlayerCW = (current) => {
                if (playerCount === 2) {
                    return current === 0 ? 1 : 0;
                } else if (playerCount === 3) {
                    if (current === 0) return 1;
                    if (current === 1) return 2;
                    return 0;
                } else { 
                    if (current === 0) return 1;
                    if (current === 1) return 2;
                    if (current === 2) return 3;
                    return 0;
                }
            };

            const prepareNextTurn = () => {
                const nextReady = [...readyPlayersRef.current];
                nextReady[currentPlayer] = true;
                setReadyPlayers(nextReady);

                if (showCalledByRef.current !== null) {
                    const nextTurns = turnsAfterShowRef.current + 1;
                    setTurnsAfterShow(nextTurns);
                    if (nextTurns >= playerCount - 1) {
                        tallyScores();
                        return;
                    }
                }
                
                setGameState('waiting-ready');
            };

            const handleReadyNextTurn = () => {
                setTurnsPlayed(prev => {
                    const next = prev + 1;
                    if (isOnlineMode) {
                        updateOnlineRoom({ turnsPlayed: next });
                    }
                    return next;
                });

                const nextPlayer = getNextPlayerCW(currentPlayer);
                setCurrentPlayer(nextPlayer);
                
                if (nextPlayer === 0) {
                    setReadyPlayers(new Array(playerCount).fill(false));
                }

                setGameState('playing');

                if (nextPlayer !== 0) {
                    setMessage(`${players[nextPlayer].name}'s turn...`);
                    aiTimerRef.current = setTimeout(() => {
                        executeAITurn(nextPlayer, false);
                    }, 1500);
                } else {
                    setMessage("Your turn! Draw or take discard.");
                }
            };

            const executeAITurn = (botIdx, isExtraTurn = false) => {
                const curDiff = difficultyRef.current || 'medium';
                let currentDeck = [...deckRef.current];
                const { deck: restoredDeck, discardPile: restoredDiscard, reshuffled } = restoreDeckFromDiscard(currentDeck, discardPileRef.current, false);
                currentDeck = restoredDeck;
                if (reshuffled) {
                    setDeck(currentDeck);
                    setDiscardPile(restoredDiscard);
                    setMessage("The discard pile was reshuffled back into the deck.");
                }

                const currentPlayers = playersRef.current || [];
                const currentAiMemory = aiMemoryRef.current || {};

                const targetablePlayers = currentPlayers.map((p, i) => {
                    if (!p || !Array.isArray(p.cards)) return null;
                    return {
                        playerIdx: i,
                        validIndices: p.cards.map((c, idx) => c !== null ? idx : null).filter(v => v !== null)
                    };
                }).filter(tp => tp && tp.validIndices.length > 0);

                const ownValid = targetablePlayers.find(tp => tp.playerIdx === botIdx)?.validIndices || [];
                const botName = currentPlayers[botIdx]?.name || 'Bot';

                let drawn = null;
                let tookDiscard = false;
                const currentDiscard = discardPileRef.current || [];
                const topDiscard = currentDiscard.length > 0 ? currentDiscard[currentDiscard.length - 1] : null;

                // Hard/Medium AI check top of discard pile
                if (topDiscard && ['8', '10', 'J', 'Q', 'K'].indexOf(topDiscard.value) === -1) {
                    const topPts = getCardPoints(topDiscard);
                    if (curDiff === 'hard' && topPts <= 4) {
                        const knowns = ownValid.map(idx => ({ idx, card: currentAiMemory[`${botIdx}-${idx}`] }));
                        const highKnown = knowns.filter(k => k.card && getCardPoints(k.card) > topPts)
                                                 .sort((a, b) => getCardPoints(b.card) - getCardPoints(a.card))[0];
                        const unknown = knowns.find(k => !k.card);
                        if (highKnown || (unknown && topPts <= 2)) {
                            tookDiscard = true;
                            drawn = topDiscard;
                            setDiscardPile(prev => prev.slice(0, prev.length - 1));
                        }
                    } else if (curDiff === 'medium' && topPts <= 2 && Math.random() < 0.4) {
                        tookDiscard = true;
                        drawn = topDiscard;
                        setDiscardPile(prev => prev.slice(0, prev.length - 1));
                    }
                }

                if (!drawn) {
                    if (currentDeck.length === 0) return;
                    drawn = currentDeck.pop();
                    if (!drawn) return;
                    setDeck(currentDeck);
                }

                if (!tookDiscard && ['8', '10', 'J', 'Q', 'K'].includes(drawn.value)) {
                    setDiscardPile(prev => [...prev, drawn]);
                    setMessage(`${botName} played power card ${drawn.value}!`);
                    
                    aiTimerRef.current = setTimeout(() => {
                        const latestPlayers = playersRef.current || [];
                        const latestAiMemory = aiMemoryRef.current || {};
                        const latestTargetable = latestPlayers.map((p, i) => {
                            if (!p || !Array.isArray(p.cards)) return null;
                            return {
                                playerIdx: i,
                                validIndices: p.cards.map((c, idx) => c !== null ? idx : null).filter(v => v !== null)
                            };
                        }).filter(tp => tp && tp.validIndices.length > 0);
                        const latestOwnValid = latestTargetable.find(tp => tp.playerIdx === botIdx)?.validIndices || [];

                        if (drawn.value === '8') {
                            if (latestOwnValid.length > 0) {
                                const unknownIndices = latestOwnValid.filter(idx => !latestAiMemory[`${botIdx}-${idx}`]);
                                const peekTarget = (curDiff !== 'easy' && unknownIndices.length > 0) 
                                    ? unknownIndices[0] 
                                    : latestOwnValid[Math.floor(Math.random() * latestOwnValid.length)];
                                const targetCard = latestPlayers[botIdx]?.cards?.[peekTarget];
                                if (targetCard) updateAiMemory(botIdx, peekTarget, targetCard);
                            }
                            setMessage(`${botName} peeked.`);
                            triggerMatchWindow(() => completeAITurn(botIdx));
                        } else if (drawn.value === '10') {
                            const opponents = latestTargetable.filter(tp => tp.playerIdx !== botIdx);
                            if (opponents.length > 0) {
                                const chosenOpp = opponents[Math.floor(Math.random() * opponents.length)];
                                if (chosenOpp && chosenOpp.validIndices.length > 0) {
                                    const chosenCardIdx = chosenOpp.validIndices[Math.floor(Math.random() * chosenOpp.validIndices.length)];
                                    const targetCard = latestPlayers[chosenOpp.playerIdx]?.cards?.[chosenCardIdx];
                                    if (targetCard) updateAiMemory(chosenOpp.playerIdx, chosenCardIdx, targetCard);
                                }
                            }
                            setMessage(`${botName} spied on a card.`);
                            triggerMatchWindow(() => completeAITurn(botIdx));
                        } else if (drawn.value === 'J') {
                            setMessage(`${botName} gets another turn from the Jack!`);
                            aiTimerRef.current = setTimeout(() => { 
                                executeAITurn(botIdx, true); 
                            }, 1800);
                        } else if (drawn.value === 'Q' || drawn.value === 'K') {
                            try {
                                const otherPlayers = latestTargetable.filter(tp => tp.playerIdx !== botIdx);
                                if (otherPlayers.length > 0 && latestOwnValid.length > 0) {
                                    const validTargets = otherPlayers.filter(tp => {
                                        const player = latestPlayers[tp.playerIdx];
                                        return Array.isArray(player?.cards) && tp.validIndices.length > 0;
                                    });

                                    if (validTargets.length > 0) {
                                        let selectedOwnIdx = null;
                                        let selectedTargetTP = null;
                                        let selectedTargetIdx = null;

                                        if (curDiff === 'hard') {
                                            let highestOwn = null;
                                            for (let idx of latestOwnValid) {
                                                const known = latestAiMemory[`${botIdx}-${idx}`];
                                                if (known && (!highestOwn || getCardPoints(known) > getCardPoints(highestOwn.card))) {
                                                    highestOwn = { idx, card: known };
                                                }
                                            }

                                            let lowestOpp = null;
                                            for (let tp of validTargets) {
                                                for (let idx of tp.validIndices) {
                                                    const known = latestAiMemory[`${tp.playerIdx}-${idx}`];
                                                    if (known && (!lowestOpp || getCardPoints(known) < getCardPoints(lowestOpp.card))) {
                                                        lowestOpp = { tp, idx, card: known };
                                                    }
                                                }
                                            }

                                            if (highestOwn && lowestOpp && getCardPoints(highestOwn.card) > getCardPoints(lowestOpp.card)) {
                                                selectedOwnIdx = highestOwn.idx;
                                                selectedTargetTP = lowestOpp.tp;
                                                selectedTargetIdx = lowestOpp.idx;
                                            }
                                        }

                                        if (!selectedOwnIdx) {
                                            selectedTargetTP = validTargets[Math.floor(Math.random() * validTargets.length)];
                                            selectedOwnIdx = latestOwnValid[Math.floor(Math.random() * latestOwnValid.length)];
                                            selectedTargetIdx = selectedTargetTP.validIndices[Math.floor(Math.random() * selectedTargetTP.validIndices.length)];
                                        }

                                        const ownPlayer = latestPlayers[botIdx];
                                        const ownCards = Array.isArray(ownPlayer?.cards) ? ownPlayer.cards : [];
                                        const targetPlayer = latestPlayers[selectedTargetTP.playerIdx];
                                        const targetCards = Array.isArray(targetPlayer?.cards) ? targetPlayer.cards : [];
                                        const ownCard = Number.isInteger(selectedOwnIdx) ? ownCards[selectedOwnIdx] : null;
                                        const targetCard = Number.isInteger(selectedTargetIdx) ? targetCards[selectedTargetIdx] : null;

                                        if (ownCard && targetCard) {
                                            performSwap(botIdx, selectedOwnIdx, selectedTargetTP.playerIdx, selectedTargetIdx, () => completeAITurn(botIdx));
                                            return;
                                        }
                                    }
                                }
                            } catch (error) {
                                console.error('AI Q/K error', error);
                            }
                            triggerMatchWindow(() => completeAITurn(botIdx));
                        }
                    }, 1500);
                } else {
                    if (ownValid.length > 0 && currentPlayers[botIdx] && Array.isArray(currentPlayers[botIdx].cards)) {
                        const botCards = [...currentPlayers[botIdx].cards];
                        const drawnPts = getCardPoints(drawn);
                        let shouldSwap = false;
                        let swapIdx = null;

                        if (curDiff === 'easy') {
                            if (Math.random() > 0.35) {
                                shouldSwap = true;
                                swapIdx = ownValid[Math.floor(Math.random() * ownValid.length)];
                            }
                        } else if (curDiff === 'medium') {
                            if (drawnPts <= 6) {
                                shouldSwap = true;
                                for (let idx of ownValid) {
                                    const known = currentAiMemory[`${botIdx}-${idx}`];
                                    if (known && getCardPoints(known) > 6) {
                                        swapIdx = idx;
                                        break;
                                    }
                                }
                                if (swapIdx === null) {
                                    const unknowns = ownValid.filter(idx => !currentAiMemory[`${botIdx}-${idx}`]);
                                    swapIdx = unknowns.length > 0 ? unknowns[0] : ownValid[Math.floor(Math.random() * ownValid.length)];
                                }
                            }
                        } else {
                            // Hard difficulty
                            if (drawnPts <= 7 || tookDiscard) {
                                let highestPts = drawnPts;
                                for (let idx of ownValid) {
                                    const known = currentAiMemory[`${botIdx}-${idx}`];
                                    if (known) {
                                        const pts = getCardPoints(known);
                                        if (pts > highestPts) {
                                            highestPts = pts;
                                            swapIdx = idx;
                                        }
                                    }
                                }
                                if (swapIdx === null) {
                                    const unknowns = ownValid.filter(idx => !currentAiMemory[`${botIdx}-${idx}`]);
                                    if (unknowns.length > 0) {
                                        swapIdx = unknowns[0];
                                        shouldSwap = true;
                                    } else if (drawnPts <= 3) {
                                        swapIdx = ownValid[0];
                                        shouldSwap = true;
                                    }
                                } else {
                                    shouldSwap = true;
                                }
                            }
                        }

                        if (shouldSwap && swapIdx !== null) {
                            setAnimatingIndices([{ playerIdx: botIdx, cardIdx: swapIdx }]);
                            setTimeout(() => {
                                const swappedOut = botCards[swapIdx];
                                botCards[swapIdx] = { ...drawn, visible: false, id: `p${botIdx}-${swapIdx}-${Date.now()}` };
                                if (swappedOut) {
                                    setDiscardPile(prev => [...prev, swappedOut].filter(Boolean));
                                }
                                
                                updateAiMemory(botIdx, swapIdx, drawn);

                                setPlayers(prev => {
                                    const nextPlayers = JSON.parse(JSON.stringify(prev));
                                    if (nextPlayers[botIdx] && Array.isArray(nextPlayers[botIdx].cards)) {
                                        nextPlayers[botIdx].cards = botCards;
                                    }
                                    return nextPlayers;
                                });
                                setAnimatingIndices([]);
                                setMessage(`${currentPlayers[botIdx]?.name || 'Bot'} swapped.`);
                                triggerMatchWindow(() => completeAITurn(botIdx));
                            }, 350);
                        } else {
                            setDiscardPile(prev => [...prev, drawn].filter(Boolean));
                            setMessage(`${currentPlayers[botIdx]?.name || 'Bot'} discarded.`);
                            triggerMatchWindow(() => completeAITurn(botIdx));
                        }
                    } else {
                        triggerMatchWindow(() => completeAITurn(botIdx));
                    }
                }
            };

            const completeAITurn = (botIdx) => {
                const nextReady = [...readyPlayersRef.current];
                nextReady[botIdx] = true;
                setReadyPlayers(nextReady);

                const curDiff = difficultyRef.current || 'medium';
                const showThreshold = curDiff === 'easy' ? 2 : curDiff === 'medium' ? 5 : 7;

                const botScore = playersRef.current[botIdx]?.cards?.reduce((sum, c) => sum + getCardPoints(c), 0) || 0;
                if (botScore <= showThreshold && showCalledByRef.current === null) {
                    soundManager.play('show');
                    setMessage(`${playersRef.current[botIdx]?.name || 'Bot'} called SHOW!`);
                    setShowCalledBy(botIdx);
                    setGameState('waiting-ready');
                } else {
                    if (showCalledByRef.current !== null) {
                        const nextTurns = turnsAfterShowRef.current + 1;
                        setTurnsAfterShow(nextTurns);
                        if (nextTurns >= playerCount - 1) {
                            tallyScores();
                        } else {
                            setGameState('waiting-ready');
                        }
                    } else {
                        setGameState('waiting-ready');
                    }
                }
            };

            const callShow = () => {
                if (showCalledBy !== null) return;
                
                const isMyTurn = isOnlineMode ? (currentPlayer === myPlayerIndex) : (currentPlayer === 0);
                if (!isMyTurn || turnsPlayed === 0 || gameState !== 'playing') return;

                soundManager.play('show');
                const callerIdx = isOnlineMode ? myPlayerIndex : 0;
                setShowCalledBy(callerIdx);
                
                if (isOnlineMode) {
                    updateOnlineRoom({
                        showCalledBy: callerIdx,
                        message: `${players[callerIdx]?.name || 'Player'} called SHOW! Final round.`
                    });
                }
                
                setMessage(isOnlineMode ? `${players[callerIdx]?.name || 'You'} called SHOW! Final round.` : "You called SHOW! Final round.");
                prepareNextTurn();
            };

            const getAnimationClass = (playerIdx, cardIdx) => {
                const anim = animatingIndices.find(a => a.playerIdx === playerIdx && a.cardIdx === cardIdx);
                if (!anim) return '';

                if (anim.action === 'burn') {
                    return 'scale-50 opacity-0 translate-y-8';
                }

                if (anim.targetPlayerIdx !== undefined) {
                    return 'scale-90 opacity-40 rotate-12';
                }

                return 'scale-90 opacity-40';
            };

            const tallyScores = () => {
                soundManager.play('show');
                const finalPlayers = playersRef.current.map(p => ({
                    ...p,
                    cards: p.cards.map(c => c ? ({...c, visible: true}) : null)
                }));
                
                const calculatedScores = playersRef.current.map(p => 
                    p.cards.reduce((sum, c) => sum + getCardPoints(c), 0)
                );

                setPlayers(finalPlayers);
                setScores(calculatedScores);
                setGameState('ended');

                const minScore = Math.min(...calculatedScores);
                const winners = [];
                calculatedScores.forEach((score, idx) => {
                    if (score === minScore) winners.push(idx === 0 ? "You" : playersRef.current[idx].name);
                });

                setMessage(`Winner: ${winners.join(" & ")} (${minScore} pts)`);

                const isYouWinner = calculatedScores[0] === minScore;
                setGameStats(prev => {
                    const nextStats = {
                        wins: prev.wins + (isYouWinner ? 1 : 0),
                        losses: prev.losses + (isYouWinner ? 0 : 1),
                        total: prev.total + 1
                    };
                    try {
                        localStorage.setItem('memory_grid_stats', JSON.stringify(nextStats));
                    } catch (e) {
                        console.error("Failed to save stats", e);
                    }
                    return nextStats;
                });
            };

            if (gameState === 'online-hub') {
                return (
                    <div className={`page-screen ${pageVisible ? 'visible' : 'hidden'} flex flex-col items-center justify-center min-h-full h-full w-full p-3 sm:p-4 text-center overflow-y-auto`}>
                        <div className="bg-emerald-950/90 border-2 border-emerald-700/80 p-5 sm:p-7 rounded-3xl shadow-2xl max-w-lg w-full backdrop-blur-md my-auto max-h-full overflow-y-auto">
                            <div className="flex justify-between items-center border-b border-emerald-800 pb-3 mb-4">
                                <div className="text-left">
                                    <h1 className="text-2xl sm:text-3xl font-black text-yellow-400">ONLINE LOBBY</h1>
                                    <p className="text-emerald-200/70 text-xs">Play in real-time with friends & players worldwide</p>
                                </div>
                                <button 
                                    onClick={() => { soundManager.play('click'); setGameState('menu'); }}
                                    className="bg-emerald-900/80 hover:bg-emerald-800 text-emerald-200 px-3 py-1.5 rounded-xl text-xs font-bold border border-emerald-700 transition-colors"
                                >
                                    ← Back
                                </button>
                            </div>

                            {/* USER PROFILE NICKNAME INPUT */}
                            <div className="bg-emerald-900/40 p-3 rounded-2xl border border-emerald-800/80 mb-4 text-left">
                                <label className="text-[11px] uppercase tracking-wider font-bold text-emerald-300 block mb-1">Your Display Name</label>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        value={playerName} 
                                        onChange={(e) => updatePlayerName(e.target.value)}
                                        onBlur={(e) => {
                                            const trimmed = e.target.value.trim();
                                            if (!trimmed) {
                                                updatePlayerName('Player');
                                            } else {
                                                updatePlayerName(trimmed);
                                            }
                                        }}
                                        maxLength={16}
                                        className="bg-slate-950/80 border border-emerald-700 text-yellow-300 font-bold px-3 py-2 rounded-xl text-sm w-full focus:outline-none focus:ring-2 focus:ring-yellow-400"
                                        placeholder="Enter nickname..."
                                    />
                                </div>
                            </div>

                            {onlineError && (
                                <div className="mb-4 bg-rose-950/90 border border-rose-600 text-rose-200 text-xs py-2 px-3 rounded-xl font-semibold animate-bounce">
                                    ⚠️ {onlineError}
                                </div>
                            )}

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4 text-left">
                                {/* CREATE ROOM CARD */}
                                <div className="bg-emerald-900/60 p-4 rounded-2xl border border-emerald-700/70 flex flex-col justify-between">
                                    <div>
                                        <h3 className="font-extrabold text-yellow-400 text-sm mb-2 flex items-center gap-1.5">
                                            <span>👑</span> Host New Game
                                        </h3>
                                        
                                        <div className="space-y-2.5 text-xs mb-3">
                                            <div>
                                                <span className="text-emerald-300 font-semibold block mb-1">Max Players:</span>
                                                <div className="flex gap-1.5">
                                                    {[2, 3, 4].map(num => (
                                                        <button
                                                            key={num}
                                                            onClick={() => setCreateMaxPlayers(num)}
                                                            className={`flex-1 py-1 rounded-lg font-bold text-xs transition-colors ${
                                                                createMaxPlayers === num 
                                                                    ? 'bg-yellow-500 text-slate-950 shadow' 
                                                                    : 'bg-emerald-950 text-emerald-300 hover:bg-emerald-800'
                                                            }`}
                                                        >
                                                            {num} P
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="flex items-center justify-between">
                                                <span className="text-emerald-300 font-semibold">Public Room:</span>
                                                <button
                                                    onClick={() => setCreateIsPublic(!createIsPublic)}
                                                    className={`px-2.5 py-1 rounded-lg text-[11px] font-extrabold ${createIsPublic ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}`}
                                                >
                                                    {createIsPublic ? '🌐 Public' : '🔒 Private'}
                                                </button>
                                            </div>

                                            <div className="flex items-center justify-between">
                                                <span className="text-emerald-300 font-semibold">Fill bots:</span>
                                                <button
                                                    onClick={() => setCreateFillBots(!createFillBots)}
                                                    className={`px-2.5 py-1 rounded-lg text-[11px] font-extrabold ${createFillBots ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400'}`}
                                                >
                                                    {createFillBots ? '🤖 Yes' : '👤 No'}

                                Settings
                            </button>
                            <button onClick={() => { soundManager.play('click'); setShowRules(true); }} className="bg-emerald-800 hover:bg-emerald-700 text-white font-bold py-1 px-2 sm:py-1.5 sm:px-3 rounded-md sm:rounded-lg text-xs transition-colors border border-slate-700 shadow laptop-btn-large">
                                Rules
                            </button>
                            <button onClick={() => { setIsMuted(soundManager.toggleMute()); }} className="bg-emerald-800 hover:bg-emerald-700 text-white font-bold py-1 px-2 sm:py-1.5 sm:px-3 rounded-md sm:rounded-lg text-xs transition-colors border border-slate-700 shadow laptop-btn-large flex items-center gap-1" title={isMuted ? "Unmute Sound Effects" : "Mute Sound Effects"}>
                                <span>{isMuted ? 'Sound: Off' : 'Sound: On'}</span>
                            </button>
                            <button onClick={() => { soundManager.play('click'); clearTimers(); handleStartClick(); }} className="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-extrabold py-1 px-2 sm:py-1.5 sm:px-3 rounded-md sm:rounded-lg text-xs transition-colors shadow laptop-btn-large">
                                Reset
                            </button>
                            <button
                                onClick={callShow}
                                disabled={
                                    gameState !== 'playing' ||
                                    showCalledBy !== null ||
                                    matchWindowActive ||
                                    !(isOnlineMode ? (currentPlayer === myPlayerIndex) : (currentPlayer === 0)) ||
                                    turnsPlayed === 0
                                }
                                className="bg-orange-600 hover:bg-orange-500 text-white font-extrabold py-1 px-2 sm:py-1.5 sm:px-3 rounded-md sm:rounded-lg text-xs disabled:opacity-50 transition-colors shadow laptop-btn-large"
                            >
                                Show!
                            </button>
                        </div>
                        {scores ? (
                            <div className="flex gap-1.5 text-[10px] sm:text-xs font-bold bg-black/30 px-2 py-1 rounded-md laptop-text-large">
                                {scores.map((score, idx) => (
                                    <span key={idx} className={idx === 0 ? "text-green-300" : "text-red-300"}>
                                        {idx === 0 ? "You" : `P${idx}`}: {score}
                                    </span>
                                ))}
                            </div>
                        ) : (
                            <div className="text-xs text-emerald-400 hidden lg:block font-medium laptop-text-large">
                                Joker (-1) | 7 (0) | Jack (11) | Queen (12) | King (13)
                            </div>
                        )}
                    </div>

                    {showRules && (
                        <div className="fixed inset-0 flex items-center justify-center p-4 z-50 backdrop-blur-sm fade-in">
                            <div className="bg-slate-900/95 border-2 border-emerald-500/30 rounded-3xl p-6 max-w-sm w-full max-h-[85vh] overflow-y-auto text-left shadow-2xl lg:max-w-3xl lg:p-8">
                                <h2 className="text-xl md:text-2xl font-black text-yellow-400 mb-4 flex justify-between items-center border-b border-slate-800 pb-3">
                                    <span>How to Play Memory Grid</span>
                                    <button onClick={() => setShowRules(false)} className="text-slate-400 hover:text-white transition-colors text-3xl font-normal">×</button>
                                </h2>
                                
                                <div className="space-y-4 text-slate-200 text-xs md:text-sm lg:grid lg:grid-cols-2 lg:gap-8 lg:space-y-0">
                                    <div className="space-y-4">
                                        <div>
                                            <h3 className="font-bold text-yellow-400 text-sm md:text-base mb-1">Objective</h3>
                                            <p className="text-slate-300 leading-relaxed">
                                                Have the lowest card score in your hand when a player yells "Show!". Keep track of your face-down cards to match or swap them out.
                                            </p>
                                        </div>

                                        <div className="border-t border-slate-800/80 pt-3">
                                            <h3 className="font-bold text-yellow-400 text-sm md:text-base mb-1">Setup & Turns</h3>
                                            <ul className="list-disc list-inside space-y-1.5 text-slate-300">
                                                <li>You get 4 cards face-down and peek at exactly 2 at the start.</li>
                                                <li>On your turn, draw from the deck or take the face-up card from the discard pile.</li>
                                                <li>Swap the card with one of your 4 face-down cards, discarding your old one.</li>
                                                <li><strong className="text-amber-400">Calling "Show!":</strong> You can only call "Show!" during your turn, and not on the very first move of the match!</li>
                                            </ul>
                                        </div>

                                        <div className="border-t border-slate-800/80 pt-3">
                                            <h3 className="font-bold text-yellow-400 text-sm md:text-base mb-1">Slap to Match!</h3>
                                            <p className="text-slate-300 leading-relaxed">
                                                When any card is discarded (or when you draw a card), players can click Match! and tap a card with the matching value to burn it. If you guess wrong with an active drawn card, that drawn card is lost!
                                            </p>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="bg-emerald-950/40 p-3 rounded-xl border border-emerald-900">
                                            <h3 className="font-bold text-yellow-400 text-sm md:text-base mb-2">Discard Powers</h3>
                                            <p className="text-slate-400 text-[11px] mb-2 leading-tight">Powers trigger immediately when sent to the discard pile:</p>
                                            <ul className="space-y-1.5 text-slate-300 text-xs">
                                                <li><strong>8:</strong> Peek at one of your own cards.</li>
                                                <li><strong>10:</strong> Spy on any opponent's card.</li>
                                                <li><strong>Jack:</strong> Take an immediate extra turn!</li>
                                                <li><strong>Queen:</strong> Swap any 2 cards on the entire table.</li>
                                                <li><strong>King:</strong> Spy on an opponent's card, then swap any 2.</li>
                                            </ul>
                                        </div>

                                        <div className="border-t border-slate-800/80 pt-3">
                                            <h3 className="font-bold text-yellow-400 text-sm md:text-base mb-1.5">Scoring Values</h3>
                                            <div className="grid grid-cols-2 gap-2 text-xs text-slate-300">
                                                <div>Joker: -1 point</div>
                                                <div>7: 0 points</div>
                                                <div>King: 13 points</div>
                                                <div>Queen: 12 points</div>
                                                <div>Jack: 11 points</div>
                                                <div>Ace: 1 point</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <button onClick={() => setShowRules(false)} className="mt-6 w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-extrabold py-3 rounded-xl transition-all shadow-md text-sm md:text-base">
                                    Continue Match
                                </button>
                            </div>
                        </div>
                    )}

                    {showSettings && (
                        <div className="fixed inset-0 flex items-center justify-center p-4 z-50 backdrop-blur-sm fade-in text-slate-200">
                            <div className="bg-slate-900/95 border-2 border-emerald-500/30 rounded-3xl p-6 max-w-sm w-full max-h-[85vh] overflow-y-auto text-left shadow-2xl lg:max-w-md">
                                <h2 className="text-xl md:text-2xl font-black text-yellow-400 mb-4 flex justify-between items-center border-b border-slate-800 pb-3">
                                    <span>⚙️ Settings Menu</span>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white transition-colors text-3xl font-normal">×</button>
                                </h2>
                                
                                <div className="space-y-5 text-xs sm:text-sm">
                                    {/* Theme Selector */}
                                    <div>
                                        <h3 className="font-bold text-yellow-400 text-sm mb-2 uppercase tracking-wider">🎴 Card Visual Theme</h3>
                                        <p className="text-slate-400 text-[11px] mb-2 leading-relaxed">Choose your aesthetic style for the deck and card faces.</p>
                                        <div className="grid grid-cols-3 gap-2">
                                            {[
                                                { id: 'retro', label: 'Retro Classic', desc: 'Felt casino vibe' },
                                                { id: 'minimalist', label: 'Minimalist', desc: 'Clean modern slab' },
                                                { id: 'neon', label: 'Neon Cyber', desc: 'Luminescent glow' }
                                            ].map(theme => (
                                                <button
                                                    key={theme.id}
                                                    onClick={() => changeCardTheme(theme.id)}
                                                    className={`py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center justify-center border-2 ${
                                                        cardTheme === theme.id 
                                                            ? 'bg-yellow-500 text-slate-950 border-yellow-300 shadow-md scale-[1.03]' 
                                                            : 'bg-slate-800/80 text-slate-300 border-slate-700 hover:bg-slate-700/80 hover:border-slate-600'
                                                    }`}
                                                >
                                                    <span className="font-extrabold uppercase text-[10px] sm:text-xs text-center leading-tight">{theme.label}</span>
                                                    <span className="text-[8px] opacity-85 mt-0.5 text-center leading-tight font-medium">{theme.desc}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Bot Difficulty Selector in settings */}
                                    <div className="border-t border-slate-800/80 pt-4">
                                        <h3 className="font-bold text-yellow-400 text-sm mb-2 uppercase tracking-wider">🤖 Bot Difficulty</h3>
                                        <div className="grid grid-cols-3 gap-2">
                                            {[
                                                { id: 'easy', label: 'Easy', desc: 'Forgiving' },
                                                { id: 'medium', label: 'Medium', desc: 'Balanced' },
                                                { id: 'hard', label: 'Hard', desc: 'Master AI' }
                                            ].map(item => (
                                                <button
                                                    key={item.id}
                                                    onClick={() => changeDifficulty(item.id)}
                                                    className={`py-2 px-1 rounded-xl text-xs font-bold transition-all flex flex-col items-center justify-center ${
                                                        difficulty === item.id 
                                                            ? item.id === 'easy' ? 'bg-emerald-600 text-white shadow-md ring-2 ring-emerald-400' :
                                                              item.id === 'medium' ? 'bg-amber-500 text-slate-950 shadow-md ring-2 ring-amber-300' :
                                                              'bg-rose-600 text-white shadow-md ring-2 ring-rose-400'
                                                            : 'bg-slate-800/80 text-slate-300 border border-slate-700 hover:bg-slate-700/80'
                                                    }`}
                                                >
                                                    <span className="font-extrabold text-xs uppercase">{item.label}</span>
                                                    <span className="text-[9px] opacity-80 font-medium">{item.desc}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Audio Selector */}
                                    <div className="border-t border-slate-800/80 pt-4 flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-yellow-400 text-sm uppercase tracking-wider">🔊 Sound Effects</h3>
                                            <p className="text-[11px] text-slate-400 leading-tight mt-0.5">Toggle ambient and move sounds</p>
                                        </div>
                                        <button 
                                            onClick={() => { setIsMuted(soundManager.toggleMute()); }}
                                            className={`font-black py-2 px-4 rounded-xl border text-xs transition-all uppercase tracking-wider ${
                                                isMuted 
                                                    ? 'bg-rose-950/80 border-rose-800 text-rose-300' 
                                                    : 'bg-emerald-800/80 border-emerald-600 text-emerald-200'
                                            }`}
                                        >
                                            {isMuted ? 'Muted' : 'Enabled'}
                                        </button>
                                    </div>

                                    {/* Game Stats reset */}
                                    <div className="border-t border-slate-800/80 pt-4 flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-yellow-400 text-sm uppercase tracking-wider">📊 Career Record</h3>
                                            <p className="text-[11px] text-slate-400 leading-tight mt-0.5">Wins: {gameStats.wins} | Losses: {gameStats.losses}</p>
                                        </div>
                                        <button 
                                            onClick={() => { resetStats(); }}
                                            disabled={gameStats.total === 0}
                                            className="bg-slate-800 hover:bg-rose-950 hover:text-rose-200 hover:border-rose-800 text-slate-300 font-bold py-1.5 px-3.5 rounded-xl border border-slate-700 text-xs transition-all disabled:opacity-30 disabled:hover:bg-slate-800 disabled:hover:text-slate-300 disabled:hover:border-slate-700"
                                        >
                                            Reset Stats
                                        </button>
                                    </div>
                                </div>

                                <button onClick={() => setShowSettings(false)} className="mt-6 w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-extrabold py-3 rounded-xl transition-all shadow-md text-sm md:text-base uppercase tracking-wider">
                                    Done
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Standard React 18 DOM Mounting
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);

        const defaultFirebaseConfig = {
            apiKey: "AIzaSyANjHu6lzGMI17fvzHtKoAuxOlxcB_DrsE",
            authDomain: "empirical-fire-26shk.firebaseapp.com",
            projectId: "empirical-fire-26shk",
            storageBucket: "empirical-fire-26shk.firebasestorage.app",
            messagingSenderId: "326125014064",
            appId: "1:326125014064:web:47300b996134fc94dc31f5",
            firestoreDatabaseId: "ai-studio-mainmemorygame-c7b702ea-9cf6-4101-9ed3-373265561d3b"
        };

        fetch('/firebase-applet-config.json')
            .then(res => res.json())
            .then(config => {
                initializeFirebaseApp(config);
                root.render(React.createElement(App));
            })
            .catch(err => {
                console.warn("Could not fetch firebase-applet-config.json dynamically, using default fallback config:", err);
                initializeFirebaseApp(defaultFirebaseConfig);
                root.render(React.createElement(App));
            });
    </script>
</body>
</html>
